server {
    listen 80 default_server;
    server_name arnavtelecom.com www.arnavtelecom.com;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    # www -> non-www
    if ($host = www.arnavtelecom.com) { return 301 https://arnavtelecom.com$request_uri; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on; gzip_vary on; gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf font/otf application/xml;

    # ------------------------------------------------------------------
    # Legacy URLs from the old e-commerce site + spam URLs (Search Console
    # Page indexing, Nov 2026: 22.3k 404s, 711 403s). 301 where a live page
    # matches; 410 Gone for everything else so Google drops them faster.
    # ------------------------------------------------------------------
    error_page 410 /404.html;

    # Folder URLs that nginx 403s (no index.html inside)
    location = /stores/ { return 301 https://arnavtelecom.com/stores.html; }
    location = /blog/   { return 301 https://arnavtelecom.com/blog.html; }

    # Old shop home / store-list URLs
    location = /shop          { return 301 https://arnavtelecom.com/; }
    location = /shop/         { return 301 https://arnavtelecom.com/; }
    location = /pages/home    { return 301 https://arnavtelecom.com/; }
    location ^~ /mobile-store-in-kolkata { return 301 https://arnavtelecom.com/stores.html; }

    # Old category / brand listings -> closest live page
    location ~* ^/(?:product-category|categories|brand|brands)(?:/|$) {
        location ~* (?:iphone|apple|ipad|macbook)        { return 301 https://arnavtelecom.com/best-iphone-store-kolkata.html; }
        location ~* (?:samsung|galaxy)                    { return 301 https://arnavtelecom.com/samsung-store-sonarpur.html; }
        location ~* (?:laptop|asus|lenovo|acer|dell|/hp(?:[-/]|$)) { return 301 https://arnavtelecom.com/laptop-shop-in-hooghly.html; }
        return 301 https://arnavtelecom.com/stores.html;
    }

    # Old product pages: brand page if obvious, otherwise 410 Gone
    location ~* ^/product/ {
        location ~* (?:iphone|apple)    { return 301 https://arnavtelecom.com/best-iphone-store-kolkata.html; }
        location ~* (?:samsung|galaxy)  { return 301 https://arnavtelecom.com/samsung-store-sonarpur.html; }
        return 410;
    }

    # Spam / old-platform paths with no equivalent -> 410 Gone
    location ~* ^/(?:item|items|interfaces|search|cart|checkout|account|my-account|apps|hc|usa|japan|canada|pages|policies|collections|products|wp-content|wp-admin|wp-json|wp-login\.php|feed|tag|author)(?:/|$) {
        return 410;
    }
    # ------------------------------------------------------------------

    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|woff|woff2|ttf|otf|eot)$ { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* \.(?:css|js)$ { expires 30d; }
    location ~* \.(?:html|xml)$ { expires 1h; }
    location ~ /\.(?!well-known) { deny all; }

    error_page 404 /404.html;
    location / { expires 1h; try_files $uri $uri.html $uri/ =404; }
}
