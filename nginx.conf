server {
    listen 80 default_server;
    server_name arnavtelecom.com www.arnavtelecom.com;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    # www -> non-www
    if ($host = www.arnavtelecom.com) { return 301 https://arnavtelecom.com$request_uri; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on; gzip_vary on; gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf font/otf application/xml;

    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|woff|woff2|ttf|otf|eot)$ { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* \.(?:css|js)$ { expires 30d; }
    location ~* \.(?:html|xml)$ { expires 1h; }
    location ~ /\.(?!well-known) { deny all; }

    error_page 404 /404.html;
    location / { expires 1h; try_files $uri $uri.html $uri/ =404; }
}
